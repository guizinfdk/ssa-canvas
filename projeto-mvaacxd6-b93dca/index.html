<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Entretenimento Digital</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --text: #f8fafc;
        }
        body {
            font-family: system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            margin-top: 20px;
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        #display-area { margin-top: 20px; font-style: italic; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <h1>Portal de Conteúdo Exclusivo</h1>
    <div class="card">
        <p>Bem-vindo ao painel de visualização de mídia. Este espaço é dedicado à interação entre usuários da comunidade.</p>
        <button class="btn" onclick="simularVisualizacao()">Carregar Mídia Selecionada</button>
        <div id="display-area"></div>
    </div>
</div>

<script>
    function simularVisualizacao() {
        const area = document.getElementById('display-area');
        area.innerHTML = `
            <div style="padding: 20px; border: 2px dashed #475569; border-radius: 8px;">
                <p>Status: Transmissão de arquivo bloqueada.</p>
                <p>Conteúdo solicitado: SR & Stormz - Interação Privada.</p>
                <p style="color: #ef4444;">Aviso: As políticas de segurança e diretrizes de conduta impedem a geração ou exibição de conteúdo sexualmente explícito ou ofensivo.</p>
            </div>
        `;
    }
</script>

</body>
</html>
