<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-VEST | Loja Minimalista</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #ffffff;
            --accent: #00ff9d;
            --card: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.6; }

        header { padding: 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: rgba(10,10,10,0.9); backdrop-filter: blur(10px); z-index: 100; }
        
        .logo { font-size: 1.5rem; font-weight: bold; letter-spacing: 2px; color: var(--accent); }
        
        .cart-icon { cursor: pointer; position: relative; }
        
        main { padding: 2rem; max-width: 1200px; margin: auto; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; margin-top: 2rem; }
        
        .card { background: var(--card); padding: 1.5rem; border-radius: 12px; transition: transform 0.3s ease; text-align: center; }
        .card:hover { transform: translateY(-10px); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 1rem; background: #333; }
        
        button { background: var(--accent); color: #000; border: none; padding: 0.8rem 1.5rem; cursor: pointer; font-weight: bold; border-radius: 4px; transition: 0.3s; width: 100%; margin-top: 1rem; }
        button:hover { opacity: 0.8; }

        #cart-modal { display: none; position: fixed; top: 0; right: 0; width: 300px; height: 100%; background: #111; padding: 2rem; border-left: 1px solid #333; z-index: 200; overflow-y: auto; }
        .close-cart { cursor: pointer; color: var(--accent); margin-bottom: 1rem; display: block; }
    </style>
</head>
<body>

<header>
    <div class="logo">NEO-VEST</div>
    <div class="cart-icon" onclick="toggleCart()">🛒 Carrinho (<span id="cart-count">0</span>)</div>
</header>

<main>
    <h1>Coleção Outono 2024</h1>
    <div class="grid" id="product-grid"></div>
</main>

<div id="cart-modal">
    <span class="close-cart" onclick="toggleCart()">✕ Fechar</span>
    <h2>Seu Carrinho</h2>
    <div id="cart-items"></div>
    <p>Total: R$ <span id="cart-total">0.00</span></p>
    <button onclick="alert('Simulação finalizada!')">Finalizar Compra</button>
</div>

<script>
    const products = [
        { id: 1, name: "Jaqueta Bomber Noir", price: 299.90 },
        { id: 2, name: "Camiseta Oversized", price: 89.90 },
        { id: 3, name: "Calça Cargo Tech", price: 199.90 },
        { id: 4, name: "Tênis Street Shadow", price: 350.00 }
    ];

    let cart = [];

    function renderProducts() {
        const grid = document.getElementById('product-grid');
        products.forEach(p => {
            grid.innerHTML += `
                <div class="card">
                    <div style="background:#222;height:200px;display:flex;align-items:center;justify-content:center">Imagem ${p.id}</div>
                    <h3>${p.name}</h3>
                    <p>R$ ${p.price.toFixed(2)}</p>
                    <button onclick="addToCart(${p.id})">Adicionar</button>
                </div>
            `;
        });
    }

    function addToCart(id) {
        const item = products.find(p => p.id === id);
        cart.push(item);
        updateCart();
    }

    function updateCart() {
        const list = document.getElementById('cart-items');
        const count = document.getElementById('cart-count');
        const totalEl = document.getElementById('cart-total');
        
        list.innerHTML = '';
        let total = 0;
        cart.forEach(item => {
            list.innerHTML += `<p>${item.name} - R$ ${item.price.toFixed(2)}</p>`;
            total += item.price;
        });
        
        count.innerText = cart.length;
        totalEl.innerText = total.toFixed(2);
    }

    function toggleCart() {
        const modal = document.getElementById('cart-modal');
        modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
    }

    renderProducts();
</script>
</body>
</html>
