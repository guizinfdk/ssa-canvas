<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Otimização de Mira</title>
    <style>
        :root {
            --primary: #00f2ff;
            --bg: #0d0f14;
            --surface: #1a1d24;
            --text: #ffffff;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .panel {
            background: var(--surface);
            padding: 2rem;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            border: 1px solid #333;
        }
        h2 { text-align: center; color: var(--primary); margin-top: 0; }
        .control-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .toggle-btn {
            background: #2c313c;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            width: 100%;
            margin: 5px 0;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        .active { background: var(--primary); color: #000; font-weight: bold; }
        .status { text-align: center; margin-top: 15px; font-size: 0.8rem; color: #888; }
    </style>
</head>
<body>

<div class="panel">
    <h2>SYSTEM BOOST V1</h2>
    
    <div class="control-group">
        <label>Aimbot Strength</label>
        <input type="range" id="aim" min="0" max="100" value="0">
    </div>

    <div class="control-group">
        <label>FOV Range</label>
        <input type="range" id="fov" min="0" max="50" value="10">
    </div>

    <button class="toggle-btn" onclick="toggle(this, 'aimlok')">Aim-Lok: OFF</button>
    <button class="toggle-btn" onclick="toggle(this, 'bypass')">Bypass System: OFF</button>
    <button class="toggle-btn" onclick="applySettings()" style="background: #27ae60; margin-top: 20px;">Aplicar Configurações</button>

    <div class="status" id="log">Status: Aguardando inicialização...</div>
</div>

<script>
    function toggle(btn, feature) {
        const isActive = btn.classList.toggle('active');
        btn.innerText = isActive ? `${feature.toUpperCase()}: ON` : `${feature.toUpperCase()}: OFF`;
        updateLog(`Configuração ${feature} alterada para ${isActive ? 'Ativo' : 'Inativo'}`);
    }

    function updateLog(msg) {
        document.getElementById('log').innerText = "Status: " + msg;
    }

    function applySettings() {
        const aim = document.getElementById('aim').value;
        const fov = document.getElementById('fov').value;
        
        // Simulação de salvamento local
        localStorage.setItem('aim_val', aim);
        localStorage.setItem('fov_val', fov);
        
        updateLog("Configurações injetadas com sucesso!");
        
        setTimeout(() => {
            alert("Otimizações aplicadas ao dispositivo virtual.");
            updateLog("Pronto para operação.");
        }, 1000);
    }

    // Inicialização ao carregar
    window.onload = () => {
        if(localStorage.getItem('aim_val')) {
            document.getElementById('aim').value = localStorage.getItem('aim_val');
            document.getElementById('fov').value = localStorage.getItem('fov_val');
            updateLog("Configurações anteriores carregadas.");
        }
    }
</script>

</body>
</html>
